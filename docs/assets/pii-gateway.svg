<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="title desc">
  <title id="title">PII Gateway — локальная подмена и восстановление данных</title>
  <desc id="desc">Документ проходит через локальную подмену. Модель работает с заменами. Исходные реквизиты восстанавливаются локально по таблице соответствий.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101d35"/><stop offset="1" stop-color="#07121f"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#73e8d0"/><stop offset="1" stop-color="#94baff"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#73e8d0"/></marker>
  </defs>
  <rect width="1280" height="440" rx="24" fill="url(#bg)"/>
  <path d="M930 0h350v210" fill="none" stroke="#283c59" stroke-width="1"/>
  <circle cx="1220" cy="34" r="185" fill="none" stroke="#1b304b" stroke-width="1"/>
  <circle cx="1220" cy="34" r="135" fill="none" stroke="#1b304b" stroke-width="1"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="48" y="40" width="5" height="40" rx="2" fill="#73e8d0"/>
    <text x="70" y="70" fill="#f4f8ff" font-size="34" font-weight="700" letter-spacing="1">PII GATEWAY</text>
    <text x="48" y="124" fill="#f4f8ff" font-size="28" font-weight="700">Полезный ИИ. Меньше личных данных в облаке.</text>
    <text x="48" y="160" fill="#a7b8cf" font-size="19">Находим → заменяем → выполняем задачу → восстанавливаем</text>
    <g fill="#12243a" stroke="#30445d">
      <rect x="48" y="212" width="244" height="126" rx="16"/>
      <rect x="360" y="212" width="244" height="126" rx="16" stroke="#73e8d0"/>
      <rect x="672" y="212" width="244" height="126" rx="16"/>
      <rect x="984" y="212" width="248" height="126" rx="16" stroke="#94baff"/>
    </g>
    <g fill="#839ab7" font-size="12" letter-spacing="2" font-weight="700">
      <text x="70" y="239">01 / ДОКУМЕНТ</text><text x="382" y="239">02 / ЛОКАЛЬНАЯ ПОДМЕНА</text>
      <text x="694" y="239">03 / МОДЕЛЬ</text><text x="1006" y="239">04 / РЕЗУЛЬТАТ</text>
    </g>
    <g fill="#f4f8ff" font-size="22" font-weight="700">
      <text x="70" y="277">Исходные данные</text><text x="382" y="277">Данные с заменами</text>
      <text x="694" y="277">ИИ готовит текст</text><text x="1006" y="277">Готовый документ</text>
    </g>
    <g fill="#a7b8cf" font-size="16">
      <text x="70" y="308">На вашем компьютере</text><text x="382" y="308">Перед запросом к модели</text>
      <text x="694" y="308">Текст с заменами</text><text x="1006" y="308">Восстановлены локально</text>
    </g>
    <g stroke="#73e8d0" stroke-width="2" marker-end="url(#arrow)">
      <path d="M308 275h34"/><path d="M620 275h34"/><path d="M932 275h34"/>
    </g>
    <rect x="48" y="376" width="22" height="4" rx="2" fill="url(#accent)"/>
    <text x="82" y="383" fill="#b7c9df" font-size="16">ФИО · Email · Телефоны · Паспорта РФ</text>
    <text x="1232" y="383" text-anchor="end" fill="#73e8d0" font-size="16">Таблица замен остаётся у пользователя</text>
  </g>
</svg>
